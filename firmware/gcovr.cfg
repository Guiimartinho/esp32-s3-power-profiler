# Coverage of the hardware-independent firmware code, measured by the host
# unit tests. Run "gcovr" in this directory after the tests of the coverage
# preset; see README.md.

root = .

# Where the coverage preset leaves its data files.
search-path = test/host/build/coverage

# Measure the code under components/ only: not the tests, not Unity.
filter = components/

# Adapters need the ESP-IDF and the hardware; they are not built on the host.
exclude = components/.*/port/

# Generated from the protocol definition; it holds constants, not code.
exclude = components/proto/include/proto/pp_proto_defs\.h

# Do not count branches the compiler adds on its own.
exclude-unreachable-branches = yes
exclude-throw-branches = yes

# The build fails below these levels.
fail-under-line = 90
fail-under-branch = 80

print-summary = yes
