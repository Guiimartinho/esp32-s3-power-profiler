name: Feature request or design change
description: Propose a new capability or a change to the specification.
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Firmware
        - Hardware
        - Host software
        - Protocol
        - Tools
        - Simulation
        - Documentation or specification
        - Several areas
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The use case or the limitation behind the request.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: >-
        What should change, in as much detail as you have. For a part of
        the carrier board, name the schematic sheet and the reference
        designator of draft A2. Give the source of every figure: a
        datasheet, a calculation, a simulation or a measurement. For a
        simulated figure, name the bench under simulation/results.
    validations:
      required: true
  - type: textarea
    id: specification
    attributes:
      label: Impact on the specification
      description: >-
        Sections, requirements (R-xx), decisions (D-xx) or firmware rules
        (F-xx) of docs/specification.md that would change, and whether the
        change touches the host protocol, the pin map of the Pico 2 or the
        calibration format, which makes it a breaking change. Leave empty
        if there are none.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
