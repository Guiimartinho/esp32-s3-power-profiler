name: Docs

# Runs on demand only for now (decision D-22 of the specification). Start
# it from the Actions tab or with "gh workflow run docs.yml". To run it
# on every change again, restore the triggers kept below as comments.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths:
  #     - "**/*.md"
  #     - ".markdownlint-cli2.jsonc"
  #     - ".github/workflows/docs.yml"
  # pull_request:
  #   paths:
  #     - "**/*.md"
  #     - ".markdownlint-cli2.jsonc"
  #     - ".github/workflows/docs.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Lint Markdown files
        run: npx --yes markdownlint-cli2@0.23.3
