name: Tools

# Runs on demand only for now (decision D-22 of the specification). Start
# it from the Actions tab or with "gh workflow run tools.yml". To run it
# on every change again, restore the triggers kept below as comments.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths:
  #     - "tools/**"
  #     - "ruff.toml"
  #     - ".github/workflows/tools.yml"
  # pull_request:
  #   paths:
  #     - "tools/**"
  #     - "ruff.toml"
  #     - ".github/workflows/tools.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install the board figures with their development tools
        run: python -m pip install -e "tools/board[dev]"

      - name: Lint
        run: ruff check tools/board

      - name: Check the formatting
        run: ruff format --check tools/board

      - name: Type check
        working-directory: tools/board
        run: mypy

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The oldest and the newest supported Python on every system. The
        # dump adapter in tools/board/kicad needs KiCad and is not run here.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.14"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install the board figures with their development tools
        run: python -m pip install -e "tools/board[dev]"

      - name: Run the tests with coverage
        working-directory: tools/board
        run: python -m pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Add the coverage summary to the job summary
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        working-directory: tools/board
        shell: bash
        run: |
          {
            echo '### Board figures coverage'
            echo
            python -m coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        uses: actions/upload-artifact@v7
        with:
          name: board-figures-coverage
          path: tools/board/coverage.xml
          if-no-files-found: warn

  package:
    name: Build the package
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build the wheel and the source distribution
        run: |
          python -m pip install build
          python -m build tools/board

      - name: Install the wheel in a clean environment and run the command
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/python -m pip install tools/board/dist/*.whl
          /tmp/wheel-check/bin/board-figures --version
