name: Host

# Runs on demand only for now (decision D-22 of the specification). Start
# it from the Actions tab or with "gh workflow run host.yml". To run it
# on every change again, restore the triggers kept below as comments.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths:
  #     - "host/**"
  #     - "protocol/**"
  #     - "ruff.toml"
  #     - ".github/workflows/host.yml"
  # pull_request:
  #   paths:
  #     - "host/**"
  #     - "protocol/**"
  #     - "ruff.toml"
  #     - ".github/workflows/host.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install the package with its development tools
        run: python -m pip install -e "host[dev]"

      - name: Lint
        run: ruff check host

      - name: Check the formatting
        run: ruff format --check host

      - name: Type check
        working-directory: host
        run: mypy

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The oldest and the newest supported Python on every system, and the
        # versions in between on Linux.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.14"]
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install the package with its development tools
        run: python -m pip install -e "host[dev]"

      - name: Run the tests with coverage
        working-directory: host
        run: python -m pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Add the coverage summary to the job summary
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        working-directory: host
        shell: bash
        run: |
          {
            echo '### Host coverage'
            echo
            python -m coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        uses: actions/upload-artifact@v7
        with:
          name: host-coverage
          path: host/coverage.xml
          if-no-files-found: warn

  package:
    name: Build the package
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build the wheel and the source distribution
        run: |
          python -m pip install build
          python -m build host

      - name: Install the wheel in a clean environment and run the command
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/python -m pip install host/dist/*.whl
          /tmp/wheel-check/bin/s3pp --version
          /tmp/wheel-check/bin/s3pp simulate --blocks 10
