name: Protocol

on:
  push:
    branches: [main]
    paths:
      - "protocol/**"
      - "firmware/components/proto/include/proto/pp_proto_defs.h"
      - "firmware/test/host/generated/**"
      - "host/src/s3_power_profiler/protocol/_defs.py"
      - "ruff.toml"
      - ".github/workflows/protocol.yml"
  pull_request:
    paths:
      - "protocol/**"
      - "firmware/components/proto/include/proto/pp_proto_defs.h"
      - "firmware/test/host/generated/**"
      - "host/src/s3_power_profiler/protocol/_defs.py"
      - "ruff.toml"
      - ".github/workflows/protocol.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-files:
    name: Generated files
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check that the generated files are up to date
        run: python protocol/generate.py --check

      - name: Install the lint tools
        # The same versions as the dev extra of host/pyproject.toml.
        run: python -m pip install ruff==0.16.10 mypy==2.4.0

      - name: Lint the generator
        run: |
          ruff check protocol
          ruff format --check protocol
          mypy --strict protocol/generate.py
