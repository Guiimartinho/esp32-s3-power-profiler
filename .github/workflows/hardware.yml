name: Hardware

# Runs on demand only for now (decision D-22 of the specification). Start
# it from the Actions tab or with "gh workflow run hardware.yml". To run it
# on every change again, restore the triggers kept below as comments.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths:
  #     - "hardware/kicad/**"
  #     - ".github/workflows/hardware.yml"
  # pull_request:
  #   paths:
  #     - "hardware/kicad/**"
  #     - ".github/workflows/hardware.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Schematic and board checks
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0
      # The image runs as an unprivileged user that cannot write to the
      # workspace mounted by the runner.
      options: --user root
    defaults:
      run:
        working-directory: hardware/kicad
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Show the KiCad version
        run: kicad-cli version

      - name: Write the full report
        run: >-
          kicad-cli sch erc --severity-all --output erc-report.txt
          power-profiler-carrier.kicad_sch

      - name: Add the report to the job summary
        run: |
          {
            echo '### Electrical rules check'
            echo
            echo '```text'
            cat erc-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on errors
        run: >-
          kicad-cli sch erc --severity-error --exit-code-violations
          --output erc-errors.txt power-profiler-carrier.kicad_sch

      - name: Export the schematic
        run: >-
          kicad-cli sch export pdf --output schematic.pdf
          power-profiler-carrier.kicad_sch

      # Warnings count as violations here, so the exit code of the check is
      # not used: the report must show no rule violation, no open connection
      # and no difference between board and schematic.
      - name: Check the board
        run: >-
          kicad-cli pcb drc --schematic-parity --severity-all
          --output drc-report.txt power-profiler-carrier.kicad_pcb

      - name: Add the board check to the job summary
        run: |
          {
            echo '### Design rules check'
            echo
            echo '```text'
            grep -E '^\*\* Found [0-9]+ ' drc-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on violations, open connections and schematic differences
        run: |
          grep -q '^\*\* Found 0 DRC violations \*\*' drc-report.txt
          grep -q '^\*\* Found 0 unconnected pads \*\*' drc-report.txt
          grep -q '^\*\* Found 0 Footprint errors \*\*' drc-report.txt

      - name: Upload the schematic and the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: carrier-schematic
          path: |
            hardware/kicad/schematic.pdf
            hardware/kicad/erc-report.txt
            hardware/kicad/erc-errors.txt
            hardware/kicad/drc-report.txt
          if-no-files-found: warn
