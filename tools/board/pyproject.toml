[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "board-figures"
dynamic = ["version"]
description = "Figures of the carrier board layout of the Open Power Profiler, calculated from the drawn copper."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["power-profiler", "pcb", "kicad", "layout"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "shapely>=2.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# The linter and the type checker are pinned to the versions of the host
# package: their findings change between releases, and the same versions
# have to run locally and in continuous integration. tomli is listed without
# a condition because the type checker reads the code as Python 3.10, where
# the package imports it.
dev = [
    "mypy==2.4.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff==0.16.10",
    "scipy-stubs>=1.14",
    "tomli>=2.0",
    "types-shapely>=2.0",
]

[project.scripts]
board-figures = "board_figures.cli:main"

[project.urls]
Repository = "https://github.com/Guiimartinho/open-power-profiler"
Changelog = "https://github.com/Guiimartinho/open-power-profiler/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/board_figures/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/board_figures"]

[tool.ruff]
# The rules live in the ruff.toml at the root of the repository. This section
# only tells the import sorter where the first-party package is.
extend = "../../ruff.toml"
src = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
# The adapter in kicad/ runs under the Python that KiCad ships, with the
# pcbnew module, and cannot run without KiCad. It is outside the package and
# so outside this measurement.
source = ["board_figures"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
files = ["src", "tests"]
