[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "circuit-sim"
dynamic = ["version"]
description = "Circuit simulations of the Open Power Profiler carrier board: benches generated from the schematic, run with ngspice, checked against the specification."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["power-profiler", "spice", "ngspice", "kicad", "simulation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Typing :: Typed",
]
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# The linter and the type checker are pinned to the versions of the host
# package: their findings change between releases, and the same versions
# have to run locally and in continuous integration. tomli is listed without
# a condition because the type checker reads the code as Python 3.10, where
# the package imports it.
dev = [
    "mypy==2.4.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff==0.16.10",
    "tomli>=2.0",
]

[project.scripts]
circuit-sim = "circuit_sim.cli:main"

[project.urls]
Repository = "https://github.com/Guiimartinho/open-power-profiler"
Changelog = "https://github.com/Guiimartinho/open-power-profiler/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/circuit_sim/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/circuit_sim"]

[tool.ruff]
# The rules live in the ruff.toml at the root of the repository. This section
# only tells the import sorter where the first-party package is.
extend = "../ruff.toml"
src = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "needs_ngspice: the test runs a deck in the ngspice shared library and is skipped where none is found",
]

[tool.coverage.run]
branch = true
source = ["circuit_sim"]
# The worker runs inside a child process with the ngspice shared library
# loaded; a machine without that library cannot run it. It is kept to the
# calls into the library and is exercised by the tests marked needs_ngspice.
omit = ["*/circuit_sim/_worker.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
files = ["src", "benches", "tests"]
