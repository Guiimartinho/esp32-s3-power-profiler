[vendor."TPS259621DDAR"]
kind = "subckt"
name = "TPS259621_TRANS"
ports = ["1", "2", "3", "4", "5", "6", "7", "8"]
library = "vendor/ti-tps259621-SLVMD53__TPS259621_PSpice_Model__TPS259621_trans.lib"
origin = "vendor"

# Pins of the subcircuit: GND MODE PR1 ST VIN1 VIN2 VOUT_0 VOUT_1.
[vendor."TPS2116DRLR"]
kind = "subckt"
name = "TPS2116_TRANS"
ports = ["1", "5", "4", "8", "3", "6", "2", "7"]
library = "vendor/ti-tps2116-TPS2116_PSPICE_TRANS__TPS2116_TRANS.LIB"
origin = "vendor"

# The model of the manufacturer for the supervisor TPS3808G01 (SLIM038A) is
# not named here: ngspice does not load it. Nine of its lines call the ERROR
# function of PSpice, which ngspice does not know.

