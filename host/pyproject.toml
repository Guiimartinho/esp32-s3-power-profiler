[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "s3-power-profiler"
dynamic = ["version"]
description = "Host software for the ESP32-S3 Power Profiler: protocol codec, device client, capture and simulation."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["esp32-s3", "power-profiler", "current-measurement", "instrumentation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware",
    "Typing :: Typed",
]
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
# The linter and the type checker are pinned: their findings change between
# releases, and the same versions have to run locally and in continuous
# integration.
dev = [
    "hypothesis>=6.100",
    "mypy==2.4.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff==0.16.10",
    "types-pyserial>=3.5",
]

[project.scripts]
s3pp = "s3_power_profiler.cli:main"

[project.urls]
Repository = "https://github.com/Guiimartinho/open-power-profiler"
Changelog = "https://github.com/Guiimartinho/open-power-profiler/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/s3_power_profiler/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/s3_power_profiler"]

[tool.ruff]
# The rules live in the ruff.toml at the root of the repository. This section
# only tells the import sorter where the first-party package is.
extend = "../ruff.toml"
src = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["s3_power_profiler"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
files = ["src", "tests"]
